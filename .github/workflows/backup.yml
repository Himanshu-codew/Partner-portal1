# Weekly encrypted database backup (see docs/BACKUP_RESTORE.md).
#
# Runs backup_data against the production database, gzips the JSON and
# encrypts it with BACKUP_PASSPHRASE (AES-256, PBKDF2), checks that the
# encrypted file decrypts back to valid JSON, then keeps only the encrypted
# file as a workflow artifact for 35 days. The plaintext never leaves the
# runner and no data is printed to the log.
#
# Repository secrets: DATABASE_URL (Neon connection string) and
# BACKUP_PASSPHRASE (16+ characters; keep a copy outside GitHub).

name: Database backup

on:
  schedule:
    - cron: '30 20 * * 0'  # Sundays 20:30 UTC = Mondays 02:00 IST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      DJANGO_SECRET_KEY: backup-only-not-used-for-serving
      DJANGO_DEBUG: 'False'
      OPENSSL_ARGS: -aes-256-cbc -pbkdf2 -iter 600000 -md sha256
    steps:
      - name: Check secrets
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::Add the DATABASE_URL and BACKUP_PASSPHRASE repository secrets (docs/BACKUP_RESTORE.md)."
            exit 1
          fi
          if [ "${#BACKUP_PASSPHRASE}" -lt 16 ]; then
            echo "::error::BACKUP_PASSPHRASE must be at least 16 characters."
            exit 1
          fi

      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Dump, compress and encrypt
        run: |
          umask 077
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          dir="$RUNNER_TEMP/backup"
          mkdir -p "$dir" "$RUNNER_TEMP/out"
          plain="$dir/partner_backup_$stamp.json"
          encrypted="$RUNNER_TEMP/out/partner_backup_$stamp.json.gz.enc"

          python manage.py backup_data --output "$plain"
          gzip -9 "$plain"
          openssl enc $OPENSSL_ARGS -salt -pass env:BACKUP_PASSPHRASE \
            -in "$plain.gz" -out "$encrypted"
          rm -f "$plain.gz"

          # Prove the artifact can be restored before keeping it.
          openssl enc -d $OPENSSL_ARGS -pass env:BACKUP_PASSPHRASE -in "$encrypted" \
            | gunzip \
            | python -c "import json, sys; print(len(json.load(sys.stdin)), 'records verified after decryption')"
          ls -l "$encrypted"

      - uses: actions/upload-artifact@v6
        with:
          name: partner-backup-${{ github.run_number }}
          path: ${{ runner.temp }}/out/*.json.gz.enc
          if-no-files-found: error
          retention-days: 35
          compression-level: 0
