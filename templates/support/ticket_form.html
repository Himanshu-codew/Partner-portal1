{% extends 'base.html' %}

{% block title %}Create Support Ticket | Partner Portal{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="bi bi-headset"></i> Create Support Ticket</h2>
    <a href="{% url 'ticket_list' %}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left"></i> Back to Tickets</a>
</div>

<div class="row">
    <div class="col-md-8 mx-auto">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-primary text-white py-3">
                <h5 class="mb-0">Describe your issue</h5>
            </div>
            <div class="card-body p-4">
                <form method="post">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold">Subject <span class="text-danger">*</span></label>
                        {{ form.subject }}
                    </div>
                    
                    <div class="mb-4">
                        <label class="form-label fw-bold">Description / Query <span class="text-danger">*</span></label>
                        {{ form.description }}
                    </div>
                    
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-success btn-lg">Submit Ticket</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
