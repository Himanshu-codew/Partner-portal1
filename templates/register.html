<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Partner Portal</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f8f9fc;
            height: 100vh;
            display: flex;
            align-items: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow-lg border-0 rounded-lg mt-5">
                    <div class="card-header bg-dark text-white text-center py-4">
                        <h3 class="font-weight-light my-1"><i class="bi bi-rocket-takeoff"></i> Partner Sign Up</h3>
                    </div>
                    <div class="card-body p-4">
                        {% if form.errors %}
                            <div class="alert alert-danger">
                                Please correct the errors below.
                                {{ form.errors }}
                            </div>
                        {% endif %}
                        <form method="post">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label class="small mb-1 fw-bold">Username <span class="text-danger">*</span></label>
                                {{ form.username }}
                            </div>
                            
                            <div class="mb-3">
                                <label class="small mb-1 fw-bold">Company Name <span class="text-danger">*</span></label>
                                {{ form.company_name }}
                            </div>
                            
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label class="small mb-1 fw-bold">Phone Number <span class="text-danger">*</span></label>
                                    {{ form.phone_number }}
                                </div>
                                <div class="col-md-6">
                                    <label class="small mb-1 fw-bold">Email Address</label>
                                    {{ form.email }}
                                </div>
                            </div>
                            
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label class="small mb-1 fw-bold">Password <span class="text-danger">*</span></label>
                                    {{ form.password }}
                                </div>
                                <div class="col-md-6">
                                    <label class="small mb-1 fw-bold">Confirm Password <span class="text-danger">*</span></label>
                                    {{ form.confirm_password }}
                                </div>
                            </div>
                            
                            <div class="d-grid mt-4">
                                <button type="submit" class="btn btn-primary btn-lg">Apply for Partner Account</button>
                            </div>
                        </form>
                    </div>
                    <div class="card-footer text-center py-3 bg-light">
                        <div class="small"><a href="{% url 'login' %}">Already have an account? Go to login</a></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
