<h3 class="mb-3 fw-bold text-center"><i class="bi bi-envelope-check me-2"></i>Check Your Email</h3>

<div class="alert alert-success text-center py-2">
    <i class="bi bi-envelope-paper me-1"></i> If an account exists for that address, a password reset link is on its way.
</div>

<p class="text-muted small text-center mb-4">The link is valid for <strong>1 hour</strong>. If it hasn't arrived yet, check your spam folder before requesting a new one.</p>

<div class="d-grid gap-2 mb-3">
    <a href="{% url 'login' %}" class="btn btn-outline-primary">Back to Login</a>
</div>

<div class="text-center small">
    <a href="{% url 'password_reset' %}" class="text-primary text-decoration-none fw-semibold">Didn't get the email? Try again</a>
</div>
