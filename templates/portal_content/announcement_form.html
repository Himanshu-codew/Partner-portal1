{% extends 'base.html' %}
{% block title %}Add Announcement | Admin Dashboard{% endblock %}
{% block content %}
<div class="mb-4">
    <a href="{% url 'content_list' %}" class="btn btn-outline-secondary mb-3"><i class="bi bi-arrow-left"></i> Back to Portal Content</a>
    <h2><i class="bi bi-plus-circle"></i> Add Announcement</h2>
</div>

<div class="card shadow-sm border-0" style="max-width: 600px;">
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            {% for field in form %}
            <div class="mb-3">
                <label for="{{ field.id_for_label }}" class="form-label fw-bold">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                <div class="text-danger small mt-1">
                    {{ field.errors|striptags }}
                </div>
                {% endif %}
            </div>
            {% endfor %}
            <div class="d-grid gap-2 mt-4">
                <button type="submit" class="btn btn-primary">Create Announcement</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
