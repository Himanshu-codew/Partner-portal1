{% extends 'base.html' %}

{% block title %}Login | Partner Portal{% endblock %}

{% block auth_content %}
<div class="row justify-content-center align-items-center" style="min-height: 100vh;">
    <div class="col-md-5">
        <div class="card shadow-lg border-0 rounded-lg mt-5">
            <div class="card-header bg-primary text-white text-center py-4">
                <h3 class="font-weight-light my-2"><i class="bi bi-rocket-takeoff"></i> Partner Portal Login</h3>
            </div>
            <div class="card-body p-5">
                <form method="post">
                    {% csrf_token %}
                    
                    {% if form.errors %}
                    <div class="alert alert-danger">
                        Invalid username or password. Please try again.
                    </div>
                    {% endif %}
                    
                    <div class="form-floating mb-3">
                        <input class="form-control" id="inputUsername" name="username" type="text" placeholder="Enter username" required />
                        <label for="inputUsername">Username</label>
                    </div>
                    <div class="form-floating mb-3">
                        <input class="form-control" id="inputPassword" name="password" type="password" placeholder="Password" required />
                        <label for="inputPassword">Password</label>
                    </div>
                    
                    <div class="d-flex align-items-center justify-content-between mt-4 mb-0">
                        <button type="submit" class="btn btn-primary w-100 py-2">Login to Portal</button>
                    </div>
                </form>
            </div>
            <div class="card-footer text-center py-3">
                <div class="small text-muted mb-2">Authorized Partners Only</div>
                <div class="small"><a href="{% url 'register' %}" class="text-primary text-decoration-none fw-bold">Need an account? Apply here!</a></div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
