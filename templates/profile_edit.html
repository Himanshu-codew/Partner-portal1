{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Edit Profile | Partner Portal{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="bi bi-pencil-square text-primary me-2"></i> Edit Profile</h2>
    <a href="{% url 'profile' %}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left"></i> Back to Profile</a>
</div>

<div class="row">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm border-0 rounded-4">
            <div class="card-body p-4">
                <form method="POST">
                    {% csrf_token %}
                    <h5 class="mb-3 border-bottom pb-2">Account Details</h5>
                    {{ u_form.as_p }}
                    
                    <h5 class="mb-3 mt-4 border-bottom pb-2">Company Information</h5>
                    {{ p_form.as_p }}
                    
                    <div class="d-flex justify-content-end gap-2 mt-4">
                        <a href="{% url 'profile' %}" class="btn btn-light">Cancel</a>
                        <button type="submit" class="btn btn-primary">Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
