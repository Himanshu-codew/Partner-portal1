<a href="{{ url }}" class="card stat-card shadow-sm h-100 p-3" style="border-radius: 16px; border: none;">
    <div class="d-flex align-items-start justify-content-between">
        <div>
            <div class="text-muted small fw-semibold text-uppercase mb-1">{{ label }}</div>
            <div class="fw-bold text-dark mb-1" style="font-size: 28px; white-space: nowrap;">{{ value }}</div>
            {% if trend %}
                <div class="small fw-semibold mt-1">
                    {% if trend.direction == 'up' %}
                        <span class="text-success"><i class="bi bi-arrow-up"></i> {{ trend.value }}%</span>
                    {% elif trend.direction == 'down' %}
                        <span class="text-danger"><i class="bi bi-arrow-down"></i> {{ trend.value }}%</span>
                    {% else %}
                        <span class="text-secondary"><i class="bi bi-arrow-left-right"></i> 0%</span>
                    {% endif %}
                    <span class="text-muted fw-normal ms-1">vs last month</span>
                </div>
            {% endif %}
        </div>
        <div class="icon-circle bg-{{ color }}-light text-{{ color }}">
            <i class="bi {{ icon }}"></i>
        </div>
    </div>
</a>
