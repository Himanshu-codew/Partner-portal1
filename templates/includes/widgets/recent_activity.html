<div class="card shadow-sm border-0 h-100">
    <div class="card-header bg-white border-bottom pt-4 pb-3">
        <h5 class="fw-bold mb-0">Recent Activity</h5>
    </div>
    <div class="card-body p-0">
        {% if recent_activity %}
        <ul class="list-group list-group-flush">
            {% for item in recent_activity %}
            <li class="list-group-item px-4 py-3 d-flex align-items-center justify-content-between">
                <div class="d-flex align-items-center">
                    <div class="icon-circle bg-{{ item.color }}-light bg-opacity-10 text-{{ item.color }} me-3" style="width: 40px; height: 40px; font-size: 1.2rem;">
                        <i class="{{ item.icon }}"></i>
                    </div>
                    <div>
                        <h6 class="mb-1 fw-semibold">{{ item.title }}</h6>
                        <p class="mb-0 small text-muted">{{ item.type }} &bull; {{ item.created_at|timesince }} ago</p>
                    </div>
                </div>
                <span class="badge bg-light text-dark border">{{ item.status }}</span>
            </li>
            {% endfor %}
        </ul>
        {% else %}
        <div class="text-center py-5 text-muted">
            <i class="bi bi-clock-history text-light mb-3" style="font-size: 3rem;"></i>
            <p>No recent activity to show yet.</p>
        </div>
        {% endif %}
    </div>
</div>
